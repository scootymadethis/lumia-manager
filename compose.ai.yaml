# Optional: docker compose -f compose.yaml -f compose.ai.yaml --profile ai ...
# No host port: only the app on the Compose network can reach Ollama.
services:
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    mem_limit: 6g
    cpus: 2.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - lumia_ollama:/root/.ollama
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
volumes:
  lumia_ollama:
