name: Deploy Lumia sulla VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumia-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, lumia-prod]
    timeout-minutes: 30
    env:
      LUMIA_DEPLOY_DIR: ${{ vars.LUMIA_DEPLOY_DIR || '/home/scooty/lumia-manager' }}
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      # Script e controlli del commit da pubblicare, non quelli ancora in produzione.
      - name: Scarica gli script di deploy
        uses: actions/checkout@v7
        with:
          path: lumia-deploy
          sparse-checkout: scripts
          persist-credentials: false
      - name: Aggiorna, verifica e riavvia app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/lumia-deploy/scripts/deploy.sh" "$LUMIA_DEPLOY_DIR"
