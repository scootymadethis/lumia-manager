<section class="page-heading"><div><a class="text-link back-link" href="/orders">← Progetti</a><h1>Nuovo ordine.</h1><p>Cominciamo da cliente, progetto e accordi.</p></div></section>
<section class="panel form-panel"><form method="post" action="/orders" class="stacked-form" data-customer-form>{{ csrf(user) }}
<label>Progetto<input name="title" required maxlength="200" placeholder="Es. FiveM · Sistema lavori"></label>
<div class="form-row"><label>Cliente Discord<select name="customer" data-customer-select><option value="">Scegli un cliente…</option>{% for id,name in customer_options %}<option value="{{ id }}">{{ name }}</option>{% endfor %}</select></label><label>Totale (€)<input name="total" required inputmode="decimal" pattern="[0-9]+([.,][0-9]{1,2})?" placeholder="1250,00"></label></div>
<details class="manual-customer"><summary>Il cliente non è nell’elenco?</summary><label>Inserisci il suo ID Discord<input name="customer_id" inputmode="numeric" pattern="[0-9]+" placeholder="ID utente" data-customer-manual></label><p class="fineprint">L’elenco usa i membri disponibili al bot e i clienti già registrati.</p></details>
<label>Descrizione e accordi<textarea name="details" rows="6" maxlength="8000" placeholder="Funzionalità, consegne e condizioni concordate."></textarea></label><label>Ticket collegato <span class="optional">Facoltativo</span><input name="ticket_id" inputmode="numeric" pattern="[0-9]+" placeholder="Numero ticket"></label><p class="fineprint">Aggiungerai milestone, consegne e tranche dal dettaglio del progetto.</p><div class="form-footer"><a class="button ghost" href="/orders">Annulla</a><button class="button primary" {% if demo %}disabled{% endif %}>Crea bozza</button></div></form></section>
