{% macro plan_part(index,milestones,title='',amount='') %}
<div class="plan-part"><div class="plan-part-header"><strong data-part-label>Tranche {{ index+1 }}</strong><button type="button" class="plan-remove" data-remove-part>Rimuovi</button></div><div class="form-row"><label>Nome<input name="part_{{ index }}_title" data-field="title" required maxlength="120" value="{{ title }}" placeholder="Es. Prima versione"></label><label>Importo (€)<input name="part_{{ index }}_amount" data-field="amount" required inputmode="decimal" value="{{ amount }}" placeholder="250,00" pattern="[0-9]+([.,][0-9]{1,2})?"></label></div><div class="form-row"><label>Disponibile dal<input name="part_{{ index }}_due" data-field="due" type="date"></label><label>Oppure dopo la milestone<select name="part_{{ index }}_milestone" data-field="milestone"><option value="">Su richiesta</option>{% for m in milestones %}<option value="{{ m.id }}">{{ m.title }}</option>{% endfor %}</select></label></div></div>
{% endmacro %}
