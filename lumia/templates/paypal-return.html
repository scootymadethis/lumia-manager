{% from 'macros.html' import csrf %}
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7">
<meta name="robots" content="noindex,nofollow">
<title>Verifica PayPal · Lumia</title>
<link rel="icon" href="/static/lumia-logo-discord.png">
<script src="/static/theme.js?v=20261019"></script>
<link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/base.css?v=20261019">
<link rel="stylesheet" href="/static/auth.css?v=20261019">
<script src="/static/paypal-return.js?v=20261019" defer></script>
</head>
<body class="auth-page">
<main class="auth-card">
  <span class="auth-mark is-busy" aria-hidden="true"><span class="brand-tile"><img src="/static/lumia-logo-discord.png" alt="" width="64" height="64"><span class="tile-edge"></span></span></span>
  <h1>Un ultimo istante.</h1>
  <p class="auth-lede" role="status">Stiamo verificando il pagamento con PayPal. Il saldo si aggiorna solo dopo la conferma dell’incasso.</p>
  <div class="auth-actions">
    <form method="post" action="/orders/{{ number }}/paypal/capture" data-paypal-capture>{{ csrf(user) }}<input type="hidden" name="token" value="{{ token }}"><button class="button primary large" type="submit">Verifica pagamento</button></form>
    <a class="text-link" href="/orders/{{ number }}">Torna al progetto</a>
  </div>
  <noscript><p class="auth-note">Premi «Verifica pagamento» per completare la verifica.</p></noscript>
</main>
</body>
</html>
