{% from 'macros.html' import csrf %}
<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verifica PayPal · Lumia</title><link rel="stylesheet" href="/static/design.css?v=8"><link rel="stylesheet" href="/static/manager.css?v=8"><script src="/static/paypal-return.js?v=8" defer></script><link rel="stylesheet" href="/static/orders.css?v=8"></head>
<body><main class="auth-shell"><section class="panel panel-body"><img src="/static/lumia-logo-discord.png" width="48" height="48" alt="Lumia"><h1>Un ultimo istante.</h1><p role="status">Stiamo verificando il pagamento con PayPal. Il saldo si aggiorna solo dopo la conferma dell’incasso.</p><form method="post" action="/orders/{{ number }}/paypal/capture" data-paypal-capture>{{ csrf(user) }}<input type="hidden" name="token" value="{{ token }}"><button class="button primary">Verifica pagamento</button></form><p><a class="text-link" href="/orders/{{ number }}">Torna al progetto</a></p><noscript><p>Premi «Verifica pagamento» per completare la verifica.</p></noscript></section></main></body></html>
