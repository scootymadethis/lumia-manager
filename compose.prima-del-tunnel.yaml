services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_HOST: 0.0.0.0
      LUMIA_DATA_DIR: /app/data
    volumes:
      - lumia_data:/app/data
      - ./config.json:/app/bootstrap.json:ro
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LUMIA_DOMAIN: ${LUMIA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  lumia_data:
  caddy_data:
  caddy_config:
